# Anchor drift check for this repository's knowledge/ entries.
#
# The checker script is fetched from HA-Contract main on every run:
# the anchor convention and the checker evolve in one canonical place
# (HA-Contract scripts/check-knowledge-anchors.sh), so no repository
# keeps a local copy — a stale pinned copy would silently stop
# enforcing newer rules (e.g. content fingerprints).
#
# Failure mode is fail-red: a fetch failure (network, 404, rename) or
# a degraded fetch (empty/truncated/wrong body) aborts the job. This
# check must never degrade into "nothing checked, green".
#
# ANCHOR_ALLOW_MISSING_ABS_PATHS=1 skips absolute-path anchors that
# point at sibling repositories absent from a single-repo CI checkout;
# in a full workspace checkout the checker runs without that variable.
name: knowledge-anchors

on:
  push:
  pull_request:

jobs:
  knowledge-anchors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch anchor checker from HA-Contract
        run: |
          set -euo pipefail
          # Retry transient network flakes; any persistent failure aborts.
          curl -fsSL --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/CoreMatch/HA-Contract/main/scripts/check-knowledge-anchors.sh \
            -o "$RUNNER_TEMP/check-knowledge-anchors.sh"
          # Guard against a degraded fetch: the real checker identifies
          # itself in its header line; anything else fails the job red.
          test -s "$RUNNER_TEMP/check-knowledge-anchors.sh"
          grep -q "check-knowledge-anchors.sh — mechanical drift check" \
            "$RUNNER_TEMP/check-knowledge-anchors.sh"

      - name: Check knowledge anchors
        run: ANCHOR_ALLOW_MISSING_ABS_PATHS=1 bash "$RUNNER_TEMP/check-knowledge-anchors.sh"
